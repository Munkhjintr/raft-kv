name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  # Image-ийг build хийж, түр Kind cluster дээр 3 pod босгоод
  # leader сонгогдох, rolling restart-аас хойш өгөгдөл үлдэх эсэхийг шалгана.
  smoke:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t raft-kv:ci .

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Load image into Kind
        run: kind load docker-image raft-kv:ci

      # Зөвхөн runner дээрх checkout-д нөлөөлнө, repo-д commit хийгдэхгүй
      - name: Point manifests at the local image
        run: |
          sed -i 's|newName: .*|newName: raft-kv|; s|newTag: .*|newTag: ci|' deploy/k8s/kustomization.yaml

      - name: Deploy
        run: kubectl apply -k deploy/k8s

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,pvc -o wide
          kubectl describe pods -l app=raft-kv | tail -n 80
          for i in 0 1 2; do echo "--- raft-kv-$i"; kubectl logs "raft-kv-$i" --tail=50 || true; done
